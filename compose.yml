# This Docker Compose file is intended for local development and does not impact
# any production environments.
#
# From the root of the project run:
#
# $ docker compose up -d --wait
#
# $ docker compose down
#
# FUTURE ENHANCEMENTS IDEAS:
# - We could consider using a `https://hub.docker.com/r/postgis/postgis/`
#   version of the database image to better align with what will be seen in
#   production on Render.

# A fixed project name lets every worktree share this container, which holds a
# database per worktree. Without it, each worktree directory starts its own
# container on the same port.
name: flick

services:
  db:
    image: postgres:18
    healthcheck:
      test:
        - "CMD"
        - "pg_isready"
        - "--username=postgres"
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      POSTGRES_PASSWORD: postgres
    # Flick uses 5418 rather than 5432, so it never reaches another project's
    # server by accident.
    ports:
      - "${POSTGRES_PORT:-5418}:5432"
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
