version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      elixir-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Each observability image deploys its own Render service on merge, so it
  # gets its own PR. Read docs/agents/observability.md before merging one.
  - package-ecosystem: "docker"
    directories:
      - "/instrumentation/*"
    schedule:
      interval: "monthly"
