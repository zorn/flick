version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      elixir-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Leave this entry ungrouped: each image deploys its own Render service on
  # merge. Read docs/agents/observability.md before merging a bump.
  - package-ecosystem: "docker"
    directories:
      - "/instrumentation/*"
    schedule:
      interval: "monthly"
