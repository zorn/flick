version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      elixir-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # The observability images. Each one deploys its own Render service on
  # merge, so they get one PR each. Read docs/agents/observability.md
  # before merging one.
  - package-ecosystem: "docker"
    directories:
      - "/instrumentation/prometheus"
      - "/instrumentation/grafana"
      - "/instrumentation/tempo"
    schedule:
      interval: "monthly"
