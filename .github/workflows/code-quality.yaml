name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

# Cancel any in-progress instances of this workflow when this instance is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_checks:
    name: Formatting, Credo, and Unused Deps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          build-app: false

      - name: Check for unused deps
        run: mix deps.unlock --check-unused

      - name: Check code formatting
        run: mix format --check-formatted
        if: always()

      - name: Run Credo
        run: mix credo --strict
        if: always()

      - name: Check for compile-time dependencies
        run: mix xref graph --label compile-connected --fail-above 0
        if: always()

      - name: Check for security vulnerabilities in Phoenix project
        run: mix sobelow --config
        if: always()

  # Runs as its own job so that an advisory reports on its own status line.
  # Accepted advisories go in `.deps-audit-ignore`.
  dependency_audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          build-app: false

      - name: Check dependencies for known vulnerabilities
        run: mix deps.audit --ignore-file .deps-audit-ignore

      - name: Check dependencies for retired packages
        run: mix hex.audit
        if: always()

  # Catches generic secrets that GitHub's free secret scanning has no pattern
  # for, such as `SECRET_KEY_BASE` or a database URL. Accepted false positives
  # go in `.betterleaksignore`. Dependabot does not track this pinned release,
  # so bump the version and checksum by hand.
  secret_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETTERLEAKS_VERSION: 1.8.1
      BETTERLEAKS_SHA256: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Scan every commit, not just the tip.
          fetch-depth: 0

      - name: Install Betterleaks
        run: |
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$tarball" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${tarball}"
          echo "${BETTERLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar --extract --gzip --file "$tarball" betterleaks
          sudo install betterleaks /usr/local/bin/betterleaks

      - name: Scan git history for secrets
        run: betterleaks git . --redact --no-banner --verbose
