# Exported from Render on 2025-09-11T13:48:20Z
databases:
- name: flick_prod
  databaseName: flick_prod
  user: flick_prod_user
  plan: basic-256mb
  region: oregon
  ipAllowList:
  - source: 0.0.0.0/0
    description: everywhere
  # NOTE: Updating postgresMajorVersion here does not upgrade an existing Render database in-place; use Render's manual/in-place upgrade tooling.
  postgresMajorVersion: "18"
  diskSizeGB: 1
services:
- type: web
  name: flick
  runtime: elixir
  repo: https://github.com/zorn/flick
  plan: starter
  envVars:
  - key: ERLANG_VERSION
    value: 28.5.0.2
  - key: ELIXIR_VERSION
    value: 1.20.1
  - key: PHX_HOSTNAME
    value: rankedvote.app
  - key: SECRET_KEY_BASE
    sync: false
  - key: PHX_SERVER
    value: "true"
  - key: BASIC_AUTH_ADMIN_PASSWORD
    sync: false
  - key: BASIC_AUTH_ADMIN_USERNAME
    sync: false
  - key: METRICS_AUTH_USERNAME
    value: flick-metrics
  - key: METRICS_AUTH_PASSWORD
    sync: false
  - key: DATABASE_URL
    fromDatabase:
      name: flick_prod
      property: connectionString
  region: oregon
  buildCommand: ./bin/build.sh
  # None of these paths reach the release, so a push that changes only them
  # skips the deploy. Ignore a path only if bin/build.sh never reads it.
  # Otherwise a push that needs a deploy skips it, and the release goes stale.
  # `*` stops at `/`, so `*.md` covers root Markdown only.
  # https://render.com/docs/monorepo-support
  buildFilter:
    ignoredPaths:
    - .github/**
    - .claude/**
    - .config/**
    - .vscode/**
    - docs/**
    - test/**
    - credo/**
    - ux-discovery/**
    - .credo.exs
    - compose.yml
    - instrumentation/**
    - "*.md"
  startCommand: _build/prod/rel/flick/bin/flick eval "Flick.Release.migrate" && _build/prod/rel/flick/bin/flick
    start
  domains:
  - www.rankedvote.app
  - rankedvote.app
  autoDeployTrigger: commit
# Flick's metrics stack. Same Dockerfiles as local dev (instrumentation/compose.yml).
- type: pserv
  name: flick-prometheus
  runtime: docker
  plan: starter
  region: oregon
  dockerfilePath: ./instrumentation/prometheus/Dockerfile
  dockerContext: ./instrumentation/prometheus
  envVars:
  - key: PROMETHEUS_CONFIG
    value: render.yml
  - key: METRICS_AUTH_PASSWORD
    fromService:
      type: web
      name: flick
      envVarKey: METRICS_AUTH_PASSWORD
  disk:
    name: prometheus-data
    mountPath: /prometheus
    sizeGB: 1
  buildFilter:
    paths:
    - instrumentation/prometheus/**
  autoDeployTrigger: commit
- type: web
  name: flick-grafana
  runtime: docker
  plan: starter
  region: oregon
  dockerfilePath: ./instrumentation/grafana/Dockerfile
  dockerContext: ./instrumentation/grafana
  healthCheckPath: /api/health
  envVars:
  # Render routes to port 10000 by default.
  - key: GF_SERVER_HTTP_PORT
    value: "10000"
  # A random password from the first sync on. Find it in the service's
  # Environment page. Grafana has no volume, so it resets to this on every deploy.
  - key: GF_SECURITY_ADMIN_PASSWORD
    generateValue: true
  - key: PROMETHEUS_HOST
    fromService:
      type: pserv
      name: flick-prometheus
      property: host
  buildFilter:
    paths:
    - instrumentation/grafana/**
  autoDeployTrigger: commit
version: "1"
