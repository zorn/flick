# Exported from Render on 2025-09-11T13:48:20Z
databases:
- name: flick_prod
  databaseName: flick_prod
  user: flick_prod_user
  plan: basic-256mb
  region: oregon
  ipAllowList:
  - source: 0.0.0.0/0
    description: everywhere
  # NOTE: Updating postgresMajorVersion here does not upgrade an existing Render database in-place; use Render's manual/in-place upgrade tooling.
  postgresMajorVersion: "18"
  diskSizeGB: 1
services:
- type: web
  name: flick
  runtime: elixir
  repo: https://github.com/zorn/flick
  plan: starter
  envVars:
  - key: ERLANG_VERSION
    value: 28.5.0.2
  - key: ELIXIR_VERSION
    value: 1.20.1
  - key: PHX_HOSTNAME
    value: rankedvote.app
  - key: SECRET_KEY_BASE
    sync: false
  - key: PHX_SERVER
    value: "true"
  - key: BASIC_AUTH_ADMIN_PASSWORD
    sync: false
  - key: BASIC_AUTH_ADMIN_USERNAME
    sync: false
  - key: DATABASE_URL
    fromDatabase:
      name: flick_prod
      property: connectionString
  region: oregon
  buildCommand: ./bin/build.sh
  # None of these paths reach the release, so a push that changes only them
  # skips the deploy. Ignore a path only if bin/build.sh never reads it.
  # Otherwise a push that needs a deploy skips it, and the release goes stale.
  # `*` stops at `/`, so `*.md` covers root Markdown only.
  # https://render.com/docs/monorepo-support
  buildFilter:
    ignoredPaths:
    - .github/**
    - .claude/**
    - .config/**
    - .vscode/**
    - docs/**
    - test/**
    - credo/**
    - ux-discovery/**
    - .credo.exs
    - compose.yml
    - "*.md"
  startCommand: _build/prod/rel/flick/bin/flick eval "Flick.Release.migrate" && _build/prod/rel/flick/bin/flick
    start
  domains:
  - www.rankedvote.app
  - rankedvote.app
  autoDeployTrigger: commit
version: "1"
