# Flick's observability stack for local development. It builds the same
# images that run on Render, so a change verified here behaves the same in
# production. From the project root:
#
#   docker compose -f instrumentation/compose.yml up -d --build
#
# Prometheus: http://localhost:9091
# Grafana:    http://localhost:3001
# ntfy:       http://localhost:8081
#
# Flick must be running on port 4000 for Prometheus to scrape it.
# Run this only from the primary checkout. The project name is fixed, so running
# it from a worktree replaces the shared containers with the worktree's builds.

name: flick-instrumentation

services:
  prometheus:
    build: ./prometheus
    ports:
      - "9091:9090"
    volumes:
      - prometheus_data:/prometheus
    # Docker Desktop defines host.docker.internal. Linux Docker Engine needs this.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    build: ./grafana
    ports:
      - "3001:3000"
    environment:
      PROMETHEUS_HOST: prometheus
      TEMPO_HOST: tempo
      # Where alerts go.
      NTFY_URL: http://ntfy/flick-alerts?template=grafana
      # Links in alerts point here.
      GF_SERVER_ROOT_URL: http://localhost:3001
      # Local only: every visitor is an admin, with no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus
      - ntfy
      - tempo

  # Receives Grafana's alerts locally. Open http://localhost:8081 and subscribe
  # to flick-alerts to read them.
  ntfy:
    image: binwiederhier/ntfy:v2.29.0
    command: serve
    ports:
      - "8081:80"

  # Stores Flick's traces. Flick sends spans to 4318, and Grafana and agents query 3200.
  tempo:
    build: ./tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - tempo_data:/var/tempo

volumes:
  prometheus_data:
  tempo_data:
