# Scrapes Flick over Render's private network. Port 10000 always reaches a
# web service's HTTP server there.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: flick
    basic_auth:
      username: flick-metrics
      # Prometheus can't read environment variables here, so the entrypoint
      # writes METRICS_AUTH_PASSWORD to this file.
      password_file: /tmp/metrics_auth_password
    static_configs:
      - targets: ["flick-ysjm:10000"]
