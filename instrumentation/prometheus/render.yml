# Scrapes Flick over Render's private network.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: flick
    # Prometheus can't read environment variables here, so the entrypoint
    # writes these files from the service's environment.
    basic_auth:
      username_file: /tmp/metrics_auth_username
      password_file: /tmp/metrics_auth_password
    file_sd_configs:
      - files: [/tmp/flick_targets.json]
