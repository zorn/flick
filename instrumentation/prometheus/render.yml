# Scrapes Flick over Render's private network.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: flick
    # Prometheus can't read environment variables here, so the entrypoint
    # writes these files from the service's environment.
    basic_auth:
      username_file: /tmp/metrics_auth_username
      password_file: /tmp/metrics_auth_password
    file_sd_configs:
      - files: [/tmp/flick_targets.json]

  # Prometheus and Tempo report their own disk use. Each exposes over a
  # thousand series, so keep only the few the stack dashboard reads.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: prometheus_tsdb_(storage_blocks_bytes|wal_storage_size_bytes|head_chunks_storage_size_bytes|lowest_timestamp_seconds|retention_limit_bytes)|process_resident_memory_bytes
        action: keep

  - job_name: tempo
    file_sd_configs:
      - files: [/tmp/tempo_targets.json]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: tempodb_backend_bytes_total|tempodb_blocklist_length|process_resident_memory_bytes
        action: keep
