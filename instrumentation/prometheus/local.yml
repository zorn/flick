# Scrapes Flick running on the host in development, plus Prometheus and Tempo.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: flick
    basic_auth:
      username: flick-metrics
      password: unsafe-metrics-password
    static_configs:
      - targets: ["host.docker.internal:4000"]
  # Prometheus and Tempo report their own disk and memory use. Each exposes
  # over a thousand series, so keep only the few the stack dashboard reads.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: prometheus_tsdb_(storage_blocks_bytes|wal_storage_size_bytes|head_chunks_storage_size_bytes|lowest_timestamp_seconds|retention_limit_bytes)|process_resident_memory_bytes
        action: keep

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: tempodb_backend_bytes_total|process_resident_memory_bytes
        action: keep
