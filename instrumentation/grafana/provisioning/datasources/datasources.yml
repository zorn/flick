apiVersion: 1

datasources:
  - name: prometheus
    # The PromEx dashboards refer to this data source as "prometheus".
    uid: prometheus
    type: prometheus
    # Compose sets this to prometheus. Render sets it to the private
    # service's internal hostname.
    url: http://$PROMETHEUS_HOST:9090
    isDefault: true
    jsonData:
      # Matches the scrape interval, so `$__rate_interval` stays correct.
      timeInterval: 15s
  - name: tempo
    uid: tempo
    type: tempo
    # Compose sets this to tempo. Render sets it to the private service's
    # internal hostname.
    url: http://$TEMPO_HOST:3200
  - name: postgres
    uid: postgres
    type: grafana-postgresql-datasource
    # Compose points this at the dev database on the host. Render points it
    # at flick_prod over the private network.
    url: $FLICK_DB_HOST:$FLICK_DB_PORT
    user: flick_grafana_reader
    secureJsonData:
      # Set by hand on Render. Never committed.
      password: $FLICK_DB_PASSWORD
    jsonData:
      database: $FLICK_DB_NAME
      sslmode: $FLICK_DB_SSLMODE
      # Flick's own pool holds 10 of the database's 100 connections.
      maxOpenConns: 2
